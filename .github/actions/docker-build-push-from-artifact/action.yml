name: Docker Build & Push from Artifact (wrapped)
description: >-
  One-step download artifact then Docker build & push: checkout (for the
  Dockerfile / build context) -> download-artifact -> docker-build. Composes
  the repo's checkout, download-artifact, and docker-build wrappers. Use it
  alone as a deploy job paired with maven-build-upload, or as the deploy half
  of a split pipeline. GitHub + Gitea compatible (Gitea must allow fetching
  GitHub actions).

inputs:
  # Artifact
  artifact-name:
    description: 'Name of the artifact to download.'
    required: false
    default: 'maven-build'
  artifact-extract-to:
    description: 'Directory to extract the artifact into. Point your Dockerfile COPY at this path.'
    required: false
    default: 'target'
  # Checkout
  checkout:
    description: 'Run the checkout step first ("true"/"false"). Set "false" if the repo (Dockerfile/context) is already present.'
    required: false
    default: 'true'
  ref:
    description: Git ref to check out. Empty = default branch.
    required: false
    default: ''
  token:
    description: Token used to fetch the repository.
    required: false
    default: ${{ github.token }}
  fetch-depth:
    description: 'Number of commits to fetch. 0 = full history.'
    required: false
    default: '1'
  submodules:
    description: 'Whether to checkout submodules: "true", "false", or "recursive".'
    required: false
    default: 'false'
  # Docker
  image:
    description: 'Image name without registry, e.g. "myorg/myapp".'
    required: true
  tags:
    description: 'Space- or newline-separated tags, e.g. "latest v1.2.3".'
    required: false
    default: 'latest'
  registry:
    description: 'Registry host (e.g. ghcr.io, docker.io, registry.example.com). Empty = docker.io.'
    required: false
    default: ''
  username:
    description: 'Registry username. Empty = skip login.'
    required: false
    default: ''
  password:
    description: 'Registry password / token.'
    required: false
    default: ''
  dockerfile:
    description: 'Path to the Dockerfile.'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Build context path.'
    required: false
    default: '.'
  platforms:
    description: 'Target platforms, e.g. "linux/amd64,linux/arm64".'
    required: false
    default: 'linux/amd64'
  push:
    description: 'Whether to push the image ("true"/"false").'
    required: false
    default: 'true'
  build-args:
    description: 'Newline-separated build args (KEY=VALUE).'
    required: false
    default: ''
  target:
    description: 'Build target stage.'
    required: false
    default: ''
  cache-from:
    description: 'Cache from, e.g. "type=gha".'
    required: false
    default: ''
  cache-to:
    description: 'Cache to, e.g. "type=gha,mode=max".'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout (for Dockerfile / build context)
      if: ${{ inputs.checkout == 'true' }}
      uses: ./.github/actions/checkout
      with:
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: ${{ inputs.submodules }}

    - name: Download build artifact
      uses: ./.github/actions/download-artifact
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-extract-to }}

    - name: Docker build & push
      uses: ./.github/actions/docker-build
      with:
        image: ${{ inputs.image }}
        tags: ${{ inputs.tags }}
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        dockerfile: ${{ inputs.dockerfile }}
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
