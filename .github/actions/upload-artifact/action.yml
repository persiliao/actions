name: Upload Artifact (wrapped)
description: >-
  Upload build outputs as a workflow artifact using actions/upload-artifact@v4
  (GitHub). Thin, typed wrapper so downstream CI has one consistent interface
  for the "store build outputs" step. For Gitea, use the sibling
  upload-artifact-gitea wrapper (actions/upload-artifact@v4 refuses non-GitHub
  servers). GitHub + Gitea compatible via the matching wrapper.

inputs:
  name:
    description: 'Artifact name.'
    required: false
    default: 'artifact'
  path:
    description: 'Path(s) to upload. Supports glob patterns, e.g. "target/*.jar".'
    required: true
  if-no-files-found:
    description: 'Behavior when nothing matches: "warn", "error", or "ignore".'
    required: false
    default: 'error'
  retention-days:
    description: 'Days to retain the artifact (empty = org/repo default).'
    required: false
    default: ''
  compression-level:
    description: 'Compression level 0-9 (empty = action default of 6).'
    required: false
    default: ''
  overwrite:
    description: 'Overwrite an existing artifact with the same name ("true"/"false").'
    required: false
    default: 'false'
  include-hidden-files:
    description: 'Include hidden files such as .gitignore in the upload ("true"/"false").'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days != '' && inputs.retention-days || '' }}
        compression-level: ${{ inputs.compression-level != '' && inputs.compression-level || '' }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
