name: Download Artifact (wrapped)
description: >-
  Download a workflow artifact using actions/download-artifact@v4 (GitHub).
  Thin, typed wrapper for a consistent downstream interface for the "fetch
  build outputs" step (e.g. before a Docker build in a later job). For Gitea,
  use the sibling download-artifact-gitea wrapper (actions/download-artifact@v4
  refuses non-GitHub servers). GitHub + Gitea compatible via the matching
  wrapper.

inputs:
  name:
    description: 'Artifact name to download.'
    required: false
    default: 'artifact'
  path:
    description: 'Directory to download into (default current directory).'
    required: false
    default: '.'
  merge-multiple:
    description: 'Merge multiple artifacts with the same name into one directory ("true"/"false").'
    required: false
    default: 'false'
  github-token:
    description: 'Token for downloading from another repository (empty = job token).'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
        github-token: ${{ inputs.github-token != '' && inputs.github-token || '' }}
