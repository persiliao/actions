name: Setup Go (wrapped)
description: >-
  Install a Go toolchain with module caching. Wraps actions/setup-go so
  downstream repos share one configuration surface. GitHub + Gitea compatible.

inputs:
  go-version:
    description: 'Go version spec, e.g. "1.22", "1.22.0", or "stable".'
    required: false
    default: 'stable'
  cache:
    description: 'Enable Go module caching.'
    required: false
    default: 'true'
  cache-dependency-path:
    description: 'Path to go.sum used for the cache key.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
