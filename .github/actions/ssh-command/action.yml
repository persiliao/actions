name: SSH Remote Command (wrapped)
description: >-
  Execute an arbitrary command/script on a remote host over SSH, via the
  published appleboy/ssh-action. Supports key or password auth, passphrase,
  environment variables, and command timeout. Thin composite wrapper — no
  hand-rolled shell. GitHub + Gitea compatible (Gitea runners need Docker and
  must allow fetching GitHub actions).

inputs:
  host:
    description: 'Remote host (IP or domain).'
    required: true
  port:
    description: 'SSH port.'
    required: false
    default: '22'
  username:
    description: 'SSH user.'
    required: true
  key:
    description: 'Private key (PEM). Provide via secrets.'
    required: false
    default: ''
  password:
    description: 'SSH password (used if key is empty).'
    required: false
    default: ''
  passphrase:
    description: 'Passphrase to decrypt the private key if protected.'
    required: false
    default: ''
  command:
    description: 'The command(s) to run on the remote host (inline script).'
    required: true
  command-timeout:
    description: 'Max execution time for the remote command, e.g. "10m", "1h".'
    required: false
    default: '10m'
  envs:
    description: 'Env vars to expose to the remote script (key=value,key2=value2).'
    required: false
    default: ''
  debug:
    description: 'Set true for verbose SSH logging.'
    required: false
    default: 'false'

outputs:
  stdout:
    description: 'Standard output of the executed command (capture_stdout enabled).'
    value: ${{ steps.run.outputs.stdout }}

runs:
  using: composite
  steps:
    - name: SSH remote command
      id: run
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ inputs.host }}
        port: ${{ inputs.port }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        password: ${{ inputs.password }}
        passphrase: ${{ inputs.passphrase }}
        script: ${{ inputs.command }}
        command_timeout: ${{ inputs.command-timeout }}
        envs: ${{ inputs.envs }}
        debug: ${{ inputs.debug }}
        capture_stdout: 'true'
