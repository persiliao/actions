name: "SCP Deploy"
description: "Deploy files via SCP with optional SSH proxy/jump host support"
author: Persi.Liao <xiangchu.liao@gmail.com>

inputs:
  # --- Target server ---
  host:
    description: "Target remote host"
    required: true
  port:
    description: "Target SSH port"
    required: false
    default: "22"
  username:
    description: "Target SSH username"
    required: true
  key:
    description: "Target SSH private key content"
    required: false
  password:
    description: "Target SSH password"
    required: false

  # --- Source / Target paths ---
  source:
    description: "Local file(s) or directory to upload (supports glob patterns)"
    required: false
    default: ''
  target:
    description: "Remote target directory path"
    required: false
    default: ''
  strip_components:
    description: "Remove the specified number of leading path elements from source"
    required: false
    default: "0"

  # --- Transfer options ---
  rm:
    description: "Remove target folder before uploading"
    required: false
    default: "false"
  overwrite:
    description: "Overwrite existing files in target"
    required: false
    default: "true"

  # --- SSH options ---
  fingerprint:
    description: "Fingerprint of target host public key"
    required: false
  passphrase:
    description: "Passphrase for SSH private key"
    required: false
  timeout:
    description: "SSH connection timeout (seconds)"
    required: false
    default: "30s"
  command_timeout:
    description: "SCP command timeout (seconds)"
    required: false
    default: "120s"

  # --- Proxy / Jump host ---
  proxy_host:
    description: "SSH proxy/jump host address"
    required: false
  proxy_port:
    description: "SSH proxy/jump host port"
    required: false
    default: "22"
  proxy_username:
    description: "SSH proxy/jump host username"
    required: false
  proxy_key:
    description: "SSH proxy/jump host private key content"
    required: false
  proxy_password:
    description: "SSH proxy/jump host password"
    required: false
  proxy_fingerprint:
    description: "Fingerprint of proxy host public key"
    required: false
  proxy_passphrase:
    description: "Passphrase for proxy SSH private key"
    required: false
  proxy_type:
    description: "Proxy type: http, socks5"
    required: false
    default: ""

  # --- Post-transfer command ---
  script:
    description: "Custom command to execute on remote server after SCP transfer completes"
    required: false
    default: ""

outputs:
  status:
    description: "SCP transfer status (success/failure)"
    value: ${{ steps.scp-transfer.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Set drone versions
      run: |
        echo "DRONE_SCP_VERSION=1.8.1" >> $GITHUB_ENV
        echo "DRONE_SSH_VERSION=1.8.4" >> $GITHUB_ENV
        echo "✅ Version variables set:"
        echo "  DRONE_SCP_VERSION=${DRONE_SCP_VERSION:-1.8.1}"
        echo "  DRONE_SSH_VERSION=${DRONE_SSH_VERSION:-1.8.4}"

    - name: Copy and rename drone binaries to GITHUB_ACTION_PATH
      run: |
        SCP_SRC="/usr/local/bin/drone-scp"
        SSH_SRC="/usr/local/bin/drone-ssh"
        ARCH=$(uname -m)
        case "${ARCH}" in
          x86_64|amd64)
            TARGETARCH="amd64"
            ;;
          aarch64|arm64)
            TARGETARCH="arm64"
            ;;
          *)
            echo "❌ Unsupported architecture: ${ARCH}"
            echo "Supported architectures: x86_64/amd64, aarch64/arm64"
            exit 1
            ;;
        esac
        
        echo "🔍 Detected system architecture: ${ARCH} -> TARGETARCH: ${TARGETARCH}"
        echo ""
        
        mkdir -p ${{ env.GITHUB_ACTION_PATH }}
        
        declare -A FILE_MAP
        FILE_MAP["$SCP_SRC"]="drone-scp-${DRONE_SCP_VERSION}-linux-${TARGETARCH}"
        FILE_MAP["$SSH_SRC"]="drone-ssh-${DRONE_SSH_VERSION}-linux-${TARGETARCH}"
        
        for SRC in "${!FILE_MAP[@]}"; do
          DEST_NAME="${FILE_MAP[$SRC]}"
          DEST_PATH="${{ env.GITHUB_ACTION_PATH }}/$DEST_NAME"
          
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST_PATH"
            chmod +x "$DEST_PATH"
            echo "✅ Copied: $(basename $SRC) -> $DEST_NAME"
          else
            echo "⚠️ Source file not found: $SRC"
          fi
        done
        
        echo ""
        echo "📁 Files in GITHUB_ACTION_PATH:"
        ls -la ${{ env.GITHUB_ACTION_PATH }}/drone-* 2>/dev/null || echo "No drone files copied"
    # --- Validate authentication ---
    - name: Validate authentication method
      shell: bash
      run: |
        if [ -z "${{ inputs.key }}" ] && [ -z "${{ inputs.password }}" ]; then
          echo "::error::Either 'key' or 'password' must be provided for target host authentication"
          exit 1
        fi

    # --- Perform SCP transfer ---
    - name: SCP file transfer
      if: inputs.source != '' && inputs.target != ''
      id: scp-transfer
      uses: appleboy/scp-action@v1
      with:
        version: ${{ env.DRONE_SCP_VERSION }}
        # Target
        host: ${{ inputs.host }}
        port: ${{ inputs.port }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        password: ${{ inputs.password }}

        # Paths
        source: ${{ inputs.source }}
        target: ${{ inputs.target }}
        strip_components: ${{ inputs.strip_components }}

        # Options
        rm: ${{ inputs.rm }}
        overwrite: ${{ inputs.overwrite }}

        # SSH
        fingerprint: ${{ inputs.fingerprint }}
        passphrase: ${{ inputs.passphrase }}
        timeout: ${{ inputs.timeout }}
        command_timeout: ${{ inputs.command_timeout }}

        # Proxy
        proxy_host: ${{ inputs.proxy_host }}
        proxy_port: ${{ inputs.proxy_port }}
        proxy_username: ${{ inputs.proxy_username }}
        proxy_key: ${{ inputs.proxy_key }}
        proxy_password: ${{ inputs.proxy_password }}
        proxy_fingerprint: ${{ inputs.proxy_fingerprint }}
        proxy_passphrase: ${{ inputs.proxy_passphrase }}
        proxy_type: ${{ inputs.proxy_type }}

    # --- Execute custom command after SCP ---
    - name: Execute remote command
      if: inputs.script != ''
      uses: appleboy/ssh-action@v1
      with:
        version: ${{ env.DRONE_SSH_VERSION }}
        # Target
        host: ${{ inputs.host }}
        port: ${{ inputs.port }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        password: ${{ inputs.password }}

        fingerprint: ${{ inputs.fingerprint }}
        passphrase: ${{ inputs.passphrase }}
        timeout: ${{ inputs.timeout }}
        command_timeout: ${{ inputs.command_timeout }}
        proxy_host: ${{ inputs.proxy_host }}
        proxy_port: ${{ inputs.proxy_port }}
        proxy_username: ${{ inputs.proxy_username }}
        proxy_key: ${{ inputs.proxy_key }}
        proxy_password: ${{ inputs.proxy_password }}
        proxy_fingerprint: ${{ inputs.proxy_fingerprint }}
        proxy_passphrase: ${{ inputs.proxy_passphrase }}
        proxy_type: ${{ inputs.proxy_type }}
        script: ${{ inputs.script }}

    # --- Output status ---
    - name: Set output status
      id: set-status
      shell: bash
      run: echo "status=success" >> "$GITHUB_OUTPUT"