name: Cache S3 (compatible)
description: >-
  S3-compatible build cache. A drop-in replacement for actions/cache that stores
  cache archives in ANY S3-compatible object store (AWS S3, MinIO, Alibaba Cloud
  OSS, Tencent COS, Wasabi, etc.) instead of the platform-native cache service.
  Wraps the existing productboard/actions-cache action (no custom shell). Single
  call: declare `key` + `path` like actions/cache; restore runs at job start and
  save runs automatically at job end (post step). Because the backend is an external
  S3 bucket, the SAME action works unchanged on GitHub and Gitea. use-fallback
  defaults to false so it never depends on the GitHub/Gitea cache service.

inputs:
  key:
    description: 'Cache key, e.g. "maven-${{ hashFiles(''**/pom.xml'') }}". Same semantics as actions/cache.'
    required: true
  path:
    description: 'Path(s) to cache. Newline- or comma-separated. Same as actions/cache.'
    required: true
  restore-keys:
    description: 'Fallback key prefixes (newline-separated), like actions/cache restore-keys.'
    required: false
    default: ''
  bucket:
    description: 'S3 / MinIO / OSS bucket name.'
    required: true
  endpoint:
    description: 'S3-compatible endpoint, e.g. "s3.amazonaws.com", "play.min.io", "oss-cn-hangzhou.aliyuncs.com". Default = AWS S3.'
    required: false
    default: s3.amazonaws.com
  region:
    description: 'Region, e.g. "us-east-1" or "oss-cn-hangzhou". Empty = SDK default.'
    required: false
    default: ''
  port:
    description: 'Custom port (mainly for MinIO self-hosted), e.g. "9000". Empty = default.'
    required: false
    default: ''
  insecure:
    description: 'Use insecure http (instead of https). For private http deployments. Default false.'
    required: false
    default: 'false'
  access-key:
    description: 'S3 / MinIO / OSS access key. Falls back to $AWS_ACCESS_KEY_ID when empty.'
    required: false
    default: ${{ env.AWS_ACCESS_KEY_ID }}
  secret-key:
    description: 'S3 / MinIO / OSS secret key. Falls back to $AWS_SECRET_ACCESS_KEY when empty.'
    required: false
    default: ${{ env.AWS_SECRET_ACCESS_KEY }}
  session-token:
    description: 'Session token for temporary credentials. Falls back to $AWS_SESSION_TOKEN when empty.'
    required: false
    default: ${{ env.AWS_SESSION_TOKEN }}
  use-fallback:
    description: 'Use the platform-native actions/cache as a fallback when S3 fails. Default false (S3 only).'
    required: false
    default: 'false'
  use-exact-key-match:
    description: 'Do not fall back to restore-keys on a miss. Default false.'
    required: false
    default: 'false'
  use-repository-prefix:
    description: 'Prefix key + restore-keys with the repository name. Default false.'
    required: false
    default: 'false'
  read-only:
    description: 'Read-only mode: restore but never save. Default false.'
    required: false
    default: 'false'
  force-save:
    description: 'Save even when the primary key matched (overwrites). Default false.'
    required: false
    default: 'false'
  retry:
    description: 'Retry S3 operations on failure. Default false.'
    required: false
    default: 'false'
  retry-count:
    description: 'Number of S3 operation retries. Default 3.'
    required: false
    default: '3'
  lookup-only:
    description: 'Only check for a hit, do not download/extract. Default false.'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'true if an exact match for the primary key was found.'
    value: ${{ steps.s3-cache.outputs.cache-hit }}
  cache-size:
    description: 'Size in bytes of the matched cache object, if any.'
    value: ${{ steps.s3-cache.outputs.cache-size }}
  cache-matched-key:
    description: 'The key of the matched cache object, if any.'
    value: ${{ steps.s3-cache.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Restore/Save cache to S3-compatible storage
      id: s3-cache
      uses: productboard/actions-cache@v1
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
        restore-keys: ${{ inputs.restore-keys }}
        bucket: ${{ inputs.bucket }}
        endpoint: ${{ inputs.endpoint }}
        region: ${{ inputs.region }}
        port: ${{ inputs.port }}
        insecure: ${{ inputs.insecure }}
        accessKey: ${{ inputs.access-key }}
        secretKey: ${{ inputs.secret-key }}
        sessionToken: ${{ inputs.session-token }}
        use-fallback: ${{ inputs.use-fallback }}
        use-exact-key-match: ${{ inputs.use-exact-key-match }}
        use-repository-prefix: ${{ inputs.use-repository-prefix }}
        read-only: ${{ inputs.read-only }}
        force-save: ${{ inputs.force-save }}
        retry: ${{ inputs.retry }}
        retry-count: ${{ inputs.retry-count }}
        lookup-only: ${{ inputs.lookup-only }}
